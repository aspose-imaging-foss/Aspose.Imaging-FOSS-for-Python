[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aspose-imaging-foss"
version = "0.1.0.dev0"
description = "Image header detection and metadata probing in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["aspose_imaging_foss"]
